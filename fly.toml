# Capybaroar web app. The publisher runs inside it (src/instrumentation.ts).
app = "capybaroar-web"
primary_region = "iad" # same region as the Supabase project

[build]
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://txaqthvlpjzzyyrszbdd.supabase.co"
    # NEXT_PUBLIC_SUPABASE_ANON_KEY is passed with --build-arg (public, but kept out of git)

[env]
  APP_URL = "https://app.capybaroar.com"
  # Link-in-bio pages live at capybaroar.com/<name> (site/nginx.conf passes them here); old /b/ links redirect there.
  BIO_URL = "https://capybaroar.com"
  NEXT_PUBLIC_SUPABASE_URL = "https://txaqthvlpjzzyyrszbdd.supabase.co"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off" # the publisher must stay up
  auto_start_machines = true
  min_machines_running = 1 # with 2 machines both stay up (auto_stop is off)

  # Two machines run side by side (fly scale count 2); /api/health answers 503 when the database doesn't answer within
  # 2 seconds or this machine's runner hasn't written its beat for 3 minutes.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
