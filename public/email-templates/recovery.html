<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Reset your password</title>
</head>
<!-- Made by scripts/email-templates.mjs. Edit that file, not this one. -->
<body style="margin:0;padding:24px 16px;background:#FFFFFF;font-family:Inter,Helvetica,Arial,sans-serif;color:#0A0A0A">
<span style="display:none;max-height:0;overflow:hidden">Choose a new password. The link works for 1 hour.</span>
<div style="max-width:520px">
<p style="margin:0 0 24px"><img src="https://capybaroar.com/brand/wordmark-light@2x.png" width="136" height="24" alt="Capybaroar" style="display:block;border:0;width:136px;height:auto"></p>
<h1 style="margin:0 0 12px;font-size:20px;font-weight:600;color:#0A0A0A">Reset your password</h1>
<p style="margin:0 0 16px;font-size:14px;line-height:1.55;color:#737373">We got a request to reset the password for {{ .Email }}. The link works once, for 1 hour.</p>
<p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FFE100;color:#0A0A0A;border:1px solid #0A0A0A;padding:10px 16px;text-decoration:none;font-weight:600;font-size:13px">Choose a new password</a></p>

<p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #EDEDED;font-size:12px;line-height:1.55;color:#737373">If you didn't ask for this, your password stays the same. Someone may have typed your email by mistake.</p>
</div>
</body>
</html>
