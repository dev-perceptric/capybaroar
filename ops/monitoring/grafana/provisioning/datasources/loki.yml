# Loki, on the same Docker network (docker-compose.yml). The alert rules and the dashboard use uid "loki".
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
