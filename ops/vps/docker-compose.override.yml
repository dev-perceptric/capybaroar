# Example override for the self-hosted Supabase in /docker/sb-capybaroar (copy it next to its docker-compose.yml as
# docker-compose.override.yml; `docker compose` reads it on its own). Service names are the ones in Supabase's
# docker-compose.yml; check yours with `docker compose config --services` and rename to match.
#
# 1. Every published port listens on 127.0.0.1 only. Caddy (on the host) is the one way in from outside. Docker
#    publishes ports past ufw, so a port bound to 0.0.0.0 is open to the internet whatever ufw says.
#    `!override` replaces the base file's port list instead of adding to it (needs Docker Compose 2.24.4 or newer).
# 2. Sign-ups must confirm their email, and passwords are at least 8 characters.
#
# Caddy in a container on the same Docker network instead of on the host? Use `ports: !reset []` everywhere below
# and point Caddy at kong:8000 and studio:3000.

services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"

  # Supavisor, the connection pooler. Only the transaction port is published: its session port is also 5432, which
  # the db line above takes, and the app and backups reach Postgres over the Docker network anyway.
  supavisor:
    ports: !override
      - "127.0.0.1:6543:6543"

  kong:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"

  studio:
    ports: !override
      - "127.0.0.1:3000:3000"

  meta:
    ports: !override
      - "127.0.0.1:8080:8080"

  analytics:
    ports: !override
      - "127.0.0.1:4000:4000"

  auth:
    environment:
      # Also set ENABLE_EMAIL_AUTOCONFIRM=false in .env (the base file maps it to GOTRUE_MAILER_AUTOCONFIRM). This line
      # wins either way. Sign-ups then need Supabase's SMTP_* settings in .env to receive their confirmation email.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      # Every sign-in email in Capybaroar's style, served by the app (made by scripts/email-templates.mjs). The emails
      # say links and codes work for 1 hour, so the expiry is set here to match.
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "https://app.capybaroar.com/email-templates/confirmation.html"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirm your email for Capybaroar"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: "https://app.capybaroar.com/email-templates/magic-link.html"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "{{ .Token }} is your Capybaroar sign-in code"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "https://app.capybaroar.com/email-templates/recovery.html"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your Capybaroar password"
      GOTRUE_MAILER_TEMPLATES_INVITE: "https://app.capybaroar.com/email-templates/invite.html"
      GOTRUE_MAILER_SUBJECTS_INVITE: "You're invited to Capybaroar"
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: "https://app.capybaroar.com/email-templates/email-change.html"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirm your new Capybaroar email"
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: "https://app.capybaroar.com/email-templates/reauthentication.html"
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: "{{ .Token }} is your Capybaroar security code"

  # Storage on Cloudflare R2 instead of the server's disk (ops/storage-r2.sh adds the R2_* values to .env and
  # copies the files first; ops/README.md, Storage on R2). The keys follow Supabase's S3 backend: files land at
  # <tenant>/<bucket>/<name>/<version> in R2_BUCKET. Remove this block and `docker compose up -d storage` to go back.
  storage:
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${R2_BUCKET}
      GLOBAL_S3_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: auto
      REGION: auto
