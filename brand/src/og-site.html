<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capybaroar homepage OG image</title>
<!-- The homepage's share image (site/public/img/og.jpg), 1200x630: the hero's words beside the calendar screenshot.
     Shot by render.mjs. -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#fffced;font-family:Inter,system-ui,sans-serif;color:#0a0a0a}
  .text{position:absolute;left:64px;top:64px;width:500px}
  .mark{display:block;height:42px;width:auto}
  .tag{display:inline-block;margin-top:44px;padding:6px 12px;border-radius:6px;background:#ffd202;color:#262209;font-size:18px;font-weight:500}
  h1{margin:22px 0 0;font-size:54px;line-height:1.04;font-weight:600;letter-spacing:-.04em}
  h1 span{color:#a3a3a3}
  .lead{margin:28px 0 0;font-size:21px;line-height:1.55;color:#737373}
  .shot{position:absolute;left:580px;top:96px;width:1152px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 32px 64px -24px rgba(0,0,0,.16)}
  .shot img{display:block;width:100%}
</style>
</head>
<body>
<div class="text">
  <img class="mark" src="../svg/wordmark-light.svg" alt="Capybaroar">
  <div class="tag">The agentic social media platform</div>
  <h1>Ask for a week of posts. <span>Get a full calendar.</span></h1>
  <p class="lead">An agent drafts your posts. You approve them. They go out to 12 networks.</p>
</div>
<div class="shot"><img src="../../site/public/img/calendar.webp" alt=""></div>
