# Typecheck and tests. Pull requests and manual runs start it here; pushes to the deploy branch run it from
# build-images.yml (workflow_call), which builds the images only after these checks pass. The app and homepage run
# on the Hostinger VPS, which picks the images up on its own.
# Actions are pinned to full commit SHAs (the tag each one was at is in the comment).
name: Checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
