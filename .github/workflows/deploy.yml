# Every merge to the main branch is tested, then deployed to Fly (app capybaroar-web).
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   FLY_API_TOKEN: from `fly tokens create deploy -a capybaroar-web`
#   NEXT_PUBLIC_SUPABASE_ANON_KEY: the Supabase publishable key, baked into the browser build
# Until FLY_API_TOKEN is set, the tests still run and the deploy step is skipped.
name: Deploy

on:
  push:
    branches: [claude/compassionate-bell-kidk43]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the one running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy to Fly
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only -a capybaroar-web --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
