# Build the app and the homepage images on every push to the deploy branch and publish them to GitHub's container
# registry (ghcr.io), only after the checks (checks.yml) pass on the same commit. Each image is tagged latest and with
# the commit SHA, so a bad release can be rolled back by pinning the VPS to an earlier SHA.
# The Hostinger VPS pulls these images. The database is the self-hosted Supabase at db.capybaroar.com; its public (anon) key
# is baked into the browser build, so it lives here in the open like any browser key.
# Actions are pinned to full commit SHAs (the tag each one was at is in the comment).
name: Build images

on:
  push:
    branches: [claude/compassionate-bell-kidk43]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  web:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://db.capybaroar.com
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzk0MTI5Njc0LCJleHAiOjIxMDk0ODk2NzR9.-Q8KakixmXY0vJdU39SLEahf6uZuSvv-yVClsc70MzY
          tags: |
            ghcr.io/${{ github.repository_owner }}/capybaroar-web:latest
            ghcr.io/${{ github.repository_owner }}/capybaroar-web:${{ github.sha }}
          cache-from: type=gha,scope=capybaroar-web
          cache-to: type=gha,mode=max,scope=capybaroar-web

  site:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/capybaroar-site:latest
            ghcr.io/${{ github.repository_owner }}/capybaroar-site:${{ github.sha }}
