# Build the app and the homepage images on every push and publish them to GitHub's container registry (ghcr.io).
# The Hostinger VPS pulls these images. The app's build needs the NEXT_PUBLIC_SUPABASE_ANON_KEY repository secret.
name: Build images

on:
  push:
    branches: [claude/compassionate-bell-kidk43]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://txaqthvlpjzzyyrszbdd.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/capybaroar-web:latest
            ghcr.io/${{ github.repository_owner }}/capybaroar-web:${{ github.sha }}
          cache-from: type=gha,scope=capybaroar-web
          cache-to: type=gha,mode=max,scope=capybaroar-web

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/capybaroar-site:latest
            ghcr.io/${{ github.repository_owner }}/capybaroar-site:${{ github.sha }}
