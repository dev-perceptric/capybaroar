# capybaroar.com (the site/ folder, Fly app capybaroar-site) deploys when a merge changes it.
# Needs a deploy token for capybaroar-site as the repository secret FLY_SITE_API_TOKEN
# (fly tokens create deploy -a capybaroar-site). Without it the run is skipped.
name: Deploy site

on:
  push:
    branches: [claude/compassionate-bell-kidk43]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_SITE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy capybaroar.com
        if: env.FLY_API_TOKEN != ''
        working-directory: site
        run: flyctl deploy --remote-only -a capybaroar-site
