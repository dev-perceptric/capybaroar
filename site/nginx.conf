# capybaroar.com: the homepage's own files first; any other one-word address is a link-in-bio page, served by the app
# (capybaroar-web) over Fly's private network, so visitors' addresses reach it as they are. The bio page's files
# (/_next/), pictures and posts (/b/) and tracked links (/l/) go the same way.
server {
  listen 8080;
  listen [::]:8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Fly's private DNS. A variable in proxy_pass makes nginx look the app up when asked, not only at start.
  resolver [fdaa::3] valid=10s ipv6=on;
  set $app http://capybaroar-web.internal:3000;

  proxy_http_version 1.1;
  proxy_set_header Host app.capybaroar.com;
  proxy_set_header Fly-Client-IP $http_fly_client_ip;
  proxy_set_header X-Forwarded-For $http_fly_client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  # Tells the app this visit came through capybaroar.com, so it doesn't send it back here.
  proxy_set_header X-Capy-Bio 1;
  proxy_read_timeout 30s;

  location / {
    try_files $uri $uri.html $uri/ @bio;
  }

  # Markdown copies of the docs (for people and AI assistants) open as text.
  location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
  }

  location ~ ^/(b|l|_next)/ {
    proxy_pass $app;
  }

  location @bio {
    rewrite "^/([a-z0-9][a-z0-9-]{1,38}[a-z0-9])/?$" /b/$1 break;
    return 404;
    proxy_pass $app;
    proxy_intercept_errors on;
  }

  error_page 404 /404.html;
}
