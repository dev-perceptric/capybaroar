# capybaroar.com homepage. Deploy from this folder: fly deploy
app = "capybaroar-site"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Link-in-bio pages live here too, so one machine stays up and a visitor never waits for a start.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
